name: Bot de Gols - Paper Trading

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Extrair projeto
        run: |
          unzip -o bot_gols_final_v5.zip -d .
          echo "Conteúdo extraído:"
          ls -la bot_gols
          echo "Conteúdo do src:"
          ls -la bot_gols/src
          echo "Procurando run_bot.py:"
          find bot_gols -name "run_bot.py" -print

      - name: Instalar dependências
        working-directory: ./bot_gols
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Criar ambiente
        working-directory: ./bot_gols
        run: |
          cat > .env << 'EOF'
          APP_ENV=PRODUCTION
          MODE=PAPER_TRADING
          POLL_INTERVAL_SECONDS=30
          DB_PATH=production_live.db
          EOF

      - name: Verificar projeto
        working-directory: ./bot_gols
        env:
          PYTHONPATH: ./src
        run: |
          echo "Diretório atual:"
          pwd
          echo "Python:"
          python --version
          echo "PYTHONPATH:"
          echo "$PYTHONPATH"
          echo "Arquivos:"
          ls -la
          echo "src:"
          ls -la src
          echo "config:"
          find src -maxdepth 2 -iname "config*" -print

      - name: Executar testes
        working-directory: ./bot_gols
        env:
          PYTHONPATH: ./src
        run: |
          if [ -d tests ]; then
            python -m pytest -q
          else
            echo "Nenhum diretório tests encontrado. Continuando..."
          fi

      - name: Iniciar o scanner
        working-directory: ./bot_gols
        env:
          PYTHONPATH: ./src
          PYTHONUNBUFFERED: "1"
        run: |
          echo "Iniciando bot..."
          echo "Script:"
          find src -name "run_bot.py" -print
          python src/scripts/run_bot.py
