name: Bot de Gols - Paper Trading

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

jobs:
  run-bot:
    runs-on: ubuntu-latest

    env:
      APP_ENV: PRODUCTION
      MODE: PAPER_TRADING
      POLL_INTERVAL_SECONDS: "30"

      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      API_FOOTBALL_HOST: v3.football.api-sports.io

      DB_PATH: production_live.db

      PAPER_STAKE: "100.0"
      PAPER_BANKROLL: "1000.0"

      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      BASE_GOAL_RATE_PER_MINUTE: "0.03"

    steps:

      # =========================================================
      # 1. BAIXAR CÓDIGO
      # =========================================================
      - name: Baixar código
        uses: actions/checkout@v4


      # =========================================================
      # 2. CONFIGURAR PYTHON
      # =========================================================
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"


      # =========================================================
      # 3. LOCALIZAR E EXTRAIR PROJETO
      # =========================================================
      - name: Preparar projeto
        shell: bash
        run: |
          set -e

          echo "Arquivos disponíveis:"
          ls -la

          if [ -f "bot_gols_final_v5.zip" ]; then
            echo "ZIP encontrado: bot_gols_final_v5.zip"

            unzip -o "bot_gols_final_v5.zip"

          elif [ -d "bot_gols" ]; then
            echo "Pasta bot_gols já existe"

          else
            echo "ERRO: Não encontrei bot_gols_final_v5.zip nem a pasta bot_gols"
            exit 1
          fi

          echo ""
          echo "Estrutura encontrada:"
          find bot_gols -maxdepth 3 -type f | sort

          echo "BOT_DIR=bot_gols" >> "$GITHUB_ENV"


      # =========================================================
      # 4. INSTALAR DEPENDÊNCIAS
      # =========================================================
      - name: Instalar dependências
        working-directory: ${{ env.BOT_DIR }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      # =========================================================
      # 5. CONFIGURAR CAMINHOS PYTHON
      #
      # src contém:
      #   config.py
      #   core/
      #   ml/
      #
      # raiz contém:
      #   models/
      #   database/
      # =========================================================
      - name: Configurar caminhos Python
        working-directory: ${{ env.BOT_DIR }}
        shell: bash
        run: |
          echo "PYTHONPATH=$GITHUB_WORKSPACE/${{ env.BOT_DIR }}/src:$GITHUB_WORKSPACE/${{ env.BOT_DIR }}" >> "$GITHUB_ENV"

          echo "PYTHONPATH configurado:"
          echo "$GITHUB_WORKSPACE/${{ env.BOT_DIR }}/src"
          echo "$GITHUB_WORKSPACE/${{ env.BOT_DIR }}"


      # =========================================================
      # 6. VERIFICAR ESTRUTURA
      # =========================================================
      - name: Verificar projeto
        working-directory: ${{ env.BOT_DIR }}
        shell: bash
        run: |
          set -e

          echo "=== VERIFICANDO ARQUIVOS PRINCIPAIS ==="

          test -f src/config.py
          test -f src/scripts/run_bot.py
          test -f src/core/live_scanner.py
          test -f models/signal.py
          test -f database/connection.py
          test -f requirements.txt

          echo "OK: estrutura do projeto encontrada"


      # =========================================================
      # 7. VERIFICAR IMPORTS
      #
      # IMPORTANTE:
      # O projeto usa models.signal
      # NÃO existe módulo chamado modelos
      # =========================================================
      - name: Verificar módulos do projeto
        working-directory: ${{ env.BOT_DIR }}
        shell: bash
        run: |
          set -e

          echo "=== TESTANDO CONFIG ==="
          python -c "from config import SystemConfig; print('OK: config')"

          echo "=== TESTANDO MODELS ==="
          python -c "from models.signal import Signal, MatchState; print('OK: models.signal')"

          echo "=== TESTANDO DATABASE ==="
          python -c "from database.connection import get_db_connection, init_db; print('OK: database.connection')"

          echo "=== TESTANDO CORE ==="
          python -c "from core.live_scanner import LiveScanner; print('OK: core.live_scanner')"

          echo "=== TODOS OS IMPORTS PRINCIPAIS OK ==="


      # =========================================================
      # 8. EXECUTAR TESTES
      #
      # Não usamos pytest porque requirements.txt não possui pytest.
      # Os testes existentes usam unittest.
      # =========================================================
      - name: Executar testes
        working-directory: ${{ env.BOT_DIR }}
        shell: bash
        run: |
          set -e

          python -m unittest discover \
            -s tests \
            -p "test*.py" \
            -v


      # =========================================================
      # 9. VERIFICAR CONFIGURAÇÃO FINAL
      # =========================================================
      - name: Verificar configuração
        working-directory: ${{ env.BOT_DIR }}
        shell: bash
        run: |
          python - <<'PY'
          import os

          print("=== CONFIGURAÇÃO ===")
          print("APP_ENV:", os.getenv("APP_ENV"))
          print("MODE:", os.getenv("MODE"))
          print("POLL_INTERVAL_SECONDS:", os.getenv("POLL_INTERVAL_SECONDS"))
          print("API_FOOTBALL_HOST:", os.getenv("API_FOOTBALL_HOST"))

          key = os.getenv("API_FOOTBALL_KEY", "")

          if key:
              print("API_FOOTBALL_KEY: configurada")
          else:
              print("AVISO: API_FOOTBALL_KEY não configurada")

          telegram_token = os.getenv("TELEGRAM_BOT_TOKEN", "")

          if telegram_token:
              print("TELEGRAM_BOT_TOKEN: configurado")
          else:
              print("AVISO: TELEGRAM_BOT_TOKEN não configurado")
          PY


      # =========================================================
      # 10. INICIAR SCANNER
      # =========================================================
      - name: Iniciar o scanner
        working-directory: ${{ env.BOT_DIR }}
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo " INICIANDO BOT DE GOLS"
          echo " MODO: PAPER TRADING"
          echo " INTERVALO: 30 SEGUNDOS"
          echo "=========================================="

          python src/scripts/run_bot.py


      # =========================================================
      # 11. SALVAR LOG SE O BOT PARAR
      # =========================================================
      - name: Salvar logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bot-logs
          path: |
            bot_gols/bot_execution.log
            bot_gols/production_live.db
          if-no-files-found: ignore
