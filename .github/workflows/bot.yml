name: Bot de Gols - Paper Trading

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Extrair projeto
        run: |
          unzip -o bot_gols_final_v5.zip -d .
          echo "Conteúdo após extração:"
          ls -la
          echo "Conteúdo do projeto:"
          ls -la bot_gols || true

      - name: Instalar dependências
        working-directory: bot_gols
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          fi
          python -m pip install pytest

      - name: Criar ambiente
        working-directory: bot_gols
        run: |
          cat > .env << 'EOF'
          APP_ENV=PRODUCTION
          MODE=PAPER_TRADING
          POLL_INTERVAL_SECONDS=30
          DB_PATH=production_live.db
          EOF

      - name: Verificar projeto
        working-directory: bot_gols
        env:
          PYTHONPATH: src
        run: |
          echo "Python:"
          python --version

          echo "Estrutura do projeto:"
          find . -maxdepth 3 -type f | sort | head -200

          echo "Verificando importações..."
          python -c "from config import SystemConfig; print('config OK')"

      - name: Executar testes
        working-directory: bot_gols
        env:
          PYTHONPATH: src
        run: |
          if [ -d tests ]; then
            python -m pytest -q
          else
            echo "Pasta tests não encontrada - pulando testes"
          fi

      - name: Iniciar o scanner
        working-directory: bot_gols
        env:
          PYTHONPATH: src
        run: |
          echo "Iniciando bot..."
          echo "Script:"
          echo "./src/scripts/run_bot.py"

          python ./src/scripts/run_bot.py
