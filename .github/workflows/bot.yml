name: Bot de Gols - Paper Trading

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Extrair projeto
        shell: bash
        run: |
          set -e

          echo "Arquivos disponíveis:"
          ls -la

          if [ ! -f "bot_gols_final_v5.zip" ]; then
            echo "ERRO: bot_gols_final_v5.zip não encontrado."
            exit 1
          fi

          unzip -o bot_gols_final_v5.zip -d .

          echo "Procurando run_bot.py..."
          BOT_SCRIPT=$(find . -type f -name "run_bot.py" -print -quit)

          if [ -z "$BOT_SCRIPT" ]; then
            echo "ERRO: run_bot.py não foi encontrado após extrair o projeto."
            echo "Arquivos encontrados:"
            find . -maxdepth 5 -type f | sort
            exit 1
          fi

          echo "run_bot.py encontrado em: $BOT_SCRIPT"
          echo "BOT_SCRIPT=$BOT_SCRIPT" >> "$GITHUB_ENV"

      - name: Instalar dependências
        shell: bash
        run: |
          set -e

          if [ -f "requirements.txt" ]; then
            pip install -r requirements.txt
          else
            echo "requirements.txt não encontrado na raiz."
            REQ_FILE=$(find . -type f -name "requirements.txt" -print -quit)

            if [ -z "$REQ_FILE" ]; then
              echo "ERRO: nenhum requirements.txt encontrado."
              exit 1
            fi

            echo "Usando: $REQ_FILE"
            pip install -r "$REQ_FILE"
          fi

      - name: Criar ambiente
        shell: bash
        run: |
          cat > .env <<'EOF'
          APP_ENV=PRODUCTION
          MODE=PAPER_TRADING
          POLL_INTERVAL_SECONDS=30
          DB_PATH=production_live.db
          EOF

      - name: Verificar projeto
        shell: bash
        run: |
          echo "Python:"
          python --version

          echo "Script:"
          echo "$BOT_SCRIPT"

          if [ ! -f "$BOT_SCRIPT" ]; then
            echo "ERRO: o script do bot não existe."
            exit 1
          fi

          echo "Projeto encontrado corretamente."

      - name: Executar testes
        shell: bash
        run: |
          if [ -d "tests" ]; then
            echo "Pasta tests encontrada. Executando testes..."
            python -m unittest discover -s tests -p "test*.py"
          else
            echo "Pasta tests não encontrada."
            echo "Nenhum teste automático para executar."
          fi

      - name: Iniciar o scanner
        shell: bash
        run: |
          set -e

          echo "Iniciando bot..."
          echo "Script: $BOT_SCRIPT"

          PYTHONPATH=src:. python "$BOT_SCRIPT"
